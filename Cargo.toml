[package]
name = "scafnix"
version = "0.1.1"
edition = "2024"
authors = ["Kavinda Rathnayake <kavindarathnayake100@gmail.com>"]
description = "A CLI tools for scaffolding projects with ease."
readme = "README.md"
repository = "https://github.com/kavinda-100/scafnix"
homepage = "https://github.com/kavinda-100/scafnix"
license = "MIT"
keywords = ["cli", "developer-tools","rust", "scaffolding", "project-generator"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
include_dir = "0.7.4"
indicatif = "0.18.6"
inquire = "0.9.4"
serde = "1.0.229"
serde_json = "1.0.151"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
